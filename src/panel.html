<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Android Run</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: var(--orca-background, #10121a);
      --surface: var(--orca-card, #191c29);
      --surface-raised: color-mix(in srgb, var(--surface) 78%, #252c43 22%);
      --text: var(--orca-foreground, #eef0f8);
      --muted: var(--orca-muted-foreground, #a7aec2);
      --border: var(--orca-border, #39405a);
      --input: var(--orca-input, #282d3e);
      --purple: #8b5cf6;
      --purple-deep: #6d35d9;
      --green: #31d98a;
      --red: #ff657d;
      --radius: 12px;
      font: 13px/1.45 var(--orca-font-family, system-ui, sans-serif);
      color: var(--text);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 240px; background: radial-gradient(ellipse at 90% 0%, color-mix(in srgb, var(--purple) 10%, transparent), transparent 36%), var(--canvas); }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled, select:disabled, input:disabled { opacity: .48; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--orca-ring, #b49aff); outline-offset: 2px; }
    .app { padding: 12px; max-width: 720px; margin: 0 auto; }
    .header, .header-title, .header-actions, .section-head, .inline, .status-row, .button-row, .project-row, .profile-row, .extra-row, .log-head { display: flex; align-items: center; }
    .header { justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .header-title { gap: 10px; min-width: 0; }
    .brand-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: white; background: linear-gradient(145deg, #a66bff, #6330d4); box-shadow: 0 0 0 1px #a987ff66; }
    .brand-icon svg { width: 24px; height: 24px; }
    h1 { font-size: 17px; line-height: 1.15; margin: 0; font-weight: 720; letter-spacing: -.02em; }
    .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .header-actions { gap: 5px; }
    .icon-btn, .quiet-btn, .outline-btn, .danger-btn, .primary-btn, .seg-btn, .profile-choice { border: 1px solid var(--border); background: var(--surface-raised); border-radius: 9px; color: var(--text); }
    .icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; padding: 0; }
    .icon-btn:hover, .quiet-btn:hover, .outline-btn:hover { border-color: color-mix(in srgb, var(--purple) 65%, var(--border)); background: color-mix(in srgb, var(--surface-raised) 78%, var(--purple) 22%); }
    .icon-btn svg, .btn-icon { width: 17px; height: 17px; }
    .project-card, .card, .yaml-card, .log-card { border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(145deg, color-mix(in srgb, var(--surface) 94%, #24233a 6%), var(--surface)); }
    .project-card { padding: 10px; margin-bottom: 12px; }
    .project-row { gap: 9px; min-width: 0; }
    .project-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: #80f0b6; background: #143b32; flex: none; font-size: 18px; }
    .project-copy { min-width: 0; flex: 1; }
    .project-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-path { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-branch { display: flex; align-items: center; gap: 4px; margin-top: 2px; color: #c0a6ff; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-branch svg { width: 12px; height: 12px; flex: none; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); white-space: nowrap; font-size: 11px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .badge.success { color: var(--green); border-color: #23815e; background: #112a25; }
    .badge.warning { color: #ffc45c; border-color: #735a2d; background: #2a2418; }
    .badge.error { color: var(--red); border-color: #7b3345; background: #2b1921; }
    .stack { display: grid; gap: 11px; }
    .section { display: grid; gap: 5px; min-width: 0; }
    .section-head { justify-content: space-between; gap: 8px; }
    .label { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .035em; text-transform: uppercase; }
    .section-title { font-size: 13px; font-weight: 680; }
    .control, .select { display: block; width: 100%; min-width: 0; height: 36px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--input); color: var(--text); }
    .control::placeholder { color: var(--muted); opacity: .82; }
    .select-wrap { display: flex; gap: 6px; min-width: 0; }
    .select-wrap .select { flex: 1; }
    .segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-raised); }
    .seg-btn { min-height: 34px; border-color: transparent; background: transparent; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .seg-btn.active, .profile-choice.active { color: #fff; background: linear-gradient(135deg, var(--purple), var(--purple-deep)); border-color: #a987ff; box-shadow: 0 4px 14px #7c3aed44; }
    .options-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .check-option { min-width: 0; padding: 7px; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; display: flex; gap: 7px; align-items: flex-start; }
    .check-option input { accent-color: var(--purple); margin: 2px 0 0; }
    .check-option span { font-size: 12px; font-weight: 580; }
    .primary-btn { width: 100%; min-height: 42px; color: white; border-color: #9d78ff; background: linear-gradient(115deg, #965cf9, #7139dd); font-size: 15px; font-weight: 720; box-shadow: 0 7px 19px #7139dd38; }
    .primary-btn:hover:not(:disabled) { filter: brightness(1.08); }
    .primary-btn:disabled { background: var(--orca-muted, #424653); border-color: var(--border); color: var(--muted); box-shadow: none; }
    .status-row { justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-top: 2px; }
    .inline { gap: 6px; min-width: 0; }
    .status-text { color: var(--muted); min-width: 0; overflow-wrap: anywhere; font-size: 11px; }
    .quiet-btn, .outline-btn, .danger-btn { padding: 6px 9px; font-size: 11px; }
    .quiet-btn { border-color: transparent; background: transparent; color: var(--muted); }
    .outline-btn { background: var(--surface-raised); }
    .danger-btn { color: var(--red); border-color: #7b3345; background: #2b1921; }
    .error-callout { padding: 9px; border-radius: 9px; border: 1px solid #7b3345; color: #ffd6dd; background: #351d29; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    .logs { display: grid; gap: 9px; }
    .log-card { padding: 9px; min-width: 0; }
    .log-head { justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    pre { margin: 0; max-height: 180px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .profile-screen { display: grid; gap: 11px; }
    .page-heading { display: flex; align-items: center; gap: 9px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .page-mark { color: #b897ff; font-size: 22px; }
    .profiles { display: grid; gap: 6px; }
    .profile-choice { text-align: left; padding: 8px 10px; min-height: 36px; }
    .profile-choice small { color: var(--muted); display: block; font-size: 10px; margin-top: 2px; }
    .card { padding: 10px; display: grid; gap: 9px; }
    .card-head { font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .field { display: grid; gap: 4px; min-width: 0; }
    .field label { color: var(--muted); font-size: 11px; }
    .fields-two { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .extra-list { display: grid; gap: 6px; }
    .extra-row { gap: 5px; min-width: 0; }
    .extra-row .control, .extra-row .select { min-width: 0; padding-inline: 7px; }
    .extra-key { flex: 1.3; }
    .extra-type { flex: 1; }
    .extra-value { flex: 1; }
    .button-row { justify-content: space-between; gap: 7px; flex-wrap: wrap; }
    details.yaml { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }
    details.yaml summary { padding: 9px 10px; cursor: pointer; font-weight: 650; }
    details.yaml pre { padding: 10px; border-top: 1px solid var(--border); max-height: 230px; }
    .hint { color: var(--muted); font-size: 11px; }
    .toast { min-height: 17px; color: var(--muted); font-size: 11px; }
    @media (max-width: 340px) {
      .app { padding: 9px; }
      .header { margin-bottom: 9px; }
      .project-card { padding: 8px; }
      .project-mark { width: 32px; height: 32px; }
      .options-grid { gap: 4px; }
      .check-option { padding: 6px 5px; }
      .status-row { align-items: flex-start; }
      .status-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>
  <script type="module" src="./panel.js"></script>
</body>
</html>
